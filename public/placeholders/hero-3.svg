<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480">
  <!-- flat, non-photographic placeholder: receding stone arches, nodding to the
       vaulted underground corridors and to a proscenium arch for kino/divadlo.
       Kept light per the "no dark hero sections" rule even though the real
       corridors are dark. -->
  <rect width="1120" height="480" fill="#F7F2E7"/>

  <!-- vanishing-point glow -->
  <circle cx="560" cy="260" r="70" fill="#F0E0B8"/>

  <!-- receding arches -->
  <g fill="none" stroke="#2A2018" stroke-width="6">
    <path d="M160,480 V300 A400,300 0 0 1 960,300 V480"/>
  </g>
  <g fill="none" stroke="#2A2018" stroke-width="5" opacity="0.75">
    <path d="M260,480 V300 A300,220 0 0 1 860,300 V480"/>
  </g>
  <g fill="none" stroke="#2A2018" stroke-width="4" opacity="0.5">
    <path d="M360,480 V300 A200,150 0 0 1 760,300 V480"/>
  </g>
  <g fill="none" stroke="#2A2018" stroke-width="3" opacity="0.3">
    <path d="M450,480 V300 A110,90 0 0 1 670,300 V480"/>
  </g>

  <text x="60" y="76" font-family="'Space Grotesk',system-ui,sans-serif" font-size="34" font-weight="700" fill="#2A2018">Kultura a události</text>
  <text x="60" y="108" font-family="system-ui,sans-serif" font-size="17" fill="#5B5039">Kino, divadlo, festivaly a koncerty</text>
</svg>
