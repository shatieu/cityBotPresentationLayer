<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480">
  <!-- flat, non-photographic placeholder: Znojmo skyline silhouette (town hall tower + Rotunda of St. Catherine) -->
  <rect width="1120" height="480" fill="#F7F2E7"/>

  <!-- quarried-stone coursing: subtle horizontal bands, not a color gradient -->
  <g opacity="0.5">
    <rect x="0" y="40" width="1120" height="1.5" fill="#D3C4A0"/>
    <rect x="0" y="80" width="1120" height="1.5" fill="#D3C4A0"/>
    <rect x="0" y="120" width="1120" height="1.5" fill="#D3C4A0"/>
    <rect x="0" y="160" width="1120" height="1.5" fill="#D3C4A0"/>
    <rect x="0" y="200" width="1120" height="1.5" fill="#D3C4A0"/>
    <rect x="0" y="240" width="1120" height="1.5" fill="#D3C4A0"/>
    <rect x="0" y="280" width="1120" height="1.5" fill="#D3C4A0"/>
    <rect x="0" y="320" width="1120" height="1.5" fill="#D3C4A0"/>
    <rect x="0" y="360" width="1120" height="1.5" fill="#D3C4A0"/>
  </g>

  <!-- late-light sun -->
  <circle cx="940" cy="100" r="34" fill="#D9B65C"/>

  <!-- hillside / river horizon -->
  <rect x="0" y="398" width="1120" height="3" fill="#D99BA8"/>
  <rect x="0" y="401" width="1120" height="79" fill="#F0E0B8"/>

  <!-- castle wall (crenellated) -->
  <rect x="70" y="352" width="210" height="49" fill="#2A2018"/>
  <g fill="#2A2018">
    <rect x="70" y="338" width="18" height="16"/>
    <rect x="104" y="338" width="18" height="16"/>
    <rect x="138" y="338" width="18" height="16"/>
    <rect x="172" y="338" width="18" height="16"/>
    <rect x="206" y="338" width="18" height="16"/>
    <rect x="240" y="338" width="18" height="16"/>
    <rect x="262" y="338" width="18" height="16"/>
  </g>

  <!-- town hall tower -->
  <rect x="520" y="188" width="28" height="213" fill="#2A2018"/>
  <polygon points="507,188 561,188 534,124" fill="#2A2018"/>
  <circle cx="534" cy="116" r="5" fill="#AD7A12"/>
  <rect x="529" y="230" width="10" height="16" fill="#F7F2E7"/>
  <rect x="529" y="270" width="10" height="16" fill="#F7F2E7"/>

  <!-- Rotunda of St. Catherine -->
  <rect x="654" y="360" width="96" height="41" fill="#2A2018"/>
  <circle cx="702" cy="332" r="48" fill="#2A2018"/>
  <rect x="691" y="378" width="22" height="23" fill="#F7F2E7"/>

  <text x="60" y="76" font-family="'Space Grotesk',system-ui,sans-serif" font-size="34" font-weight="700" fill="#2A2018">Znojmo</text>
  <text x="60" y="108" font-family="system-ui,sans-serif" font-size="17" fill="#5B5039">Město s příběhem</text>
</svg>
